name: Plugin compatibility
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The plugin helper from DroppedNeedle v3.1.0 (sdk/python/droppedneedle_plugin.py).
      - uses: actions/checkout@v4
        with:
          repository: DroppedNeedle/DroppedNeedle
          ref: 29b4113715aabcd0203926fdbeb9b454fac2fe5e
          path: upstream
          sparse-checkout: sdk
      # The DroppedNeedle Docker image runs plugins with Debian bookworm's Python 3.11.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest ruff
      - run: python -m pytest -q
        env:
          DROPPEDNEEDLE_SOURCE: ${{ github.workspace }}/upstream
      - run: python -m ruff check .
      - run: python -m ruff format --check .
